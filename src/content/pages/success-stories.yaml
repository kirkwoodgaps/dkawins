testimonials:
  # SOURCE: .../2017/10/kaatsu-logo.png
  - client: KAATSU
    author: John Doolittle
    role: Global Chief Revenue Officer
    logo: /images/clients/kaatsu.png
    quote: >-
      Gregg, I think we picked a good consulting company with DKA. The government
      evaluator who’s reviewing our application just told us this during our
      call: ‘This is the cleanest GSA Schedule submission I have seen in over a
      year.’

  # SOURCE: .../2017/10/Ideum.png
  - client: Ideum
    author: Jim Spadaccini
    role: Founder & CEO
    logo: /images/clients/ideum.png
    quote: >-
      DKA helped us navigate complex Government systems with virtual ease. Now
      our products are being sold directly to Federal agencies.

  # SOURCE: .../2017/10/547114_539122169459467_11946938_n.png — filename is
  # meaningless; identified as Argent World from surrounding copy. Confirm on
  # download. See MIGRATION-NOTES.md § 2.4.
  - client: Argent World Services, LLC
    author: Scott Geroux
    logo: /images/clients/argent-world-services.png
    # NOTE: "lets get it done" is missing its apostrophe on the live site. The
    # draft silently corrected it to "let's". Left as published — it is inside a
    # named person's quotation.
    quote: >-
      We met DKA while researching companies who can handle all of our US
      Government contracting needs. I personally called several dozen “Proposal
      Writer” type companies. After several weeks of researching our best options
      with the companies out there who perform government proposal writing we
      came across DKA. I flew down to meet with these folks and I can say I was
      impressed with their operations. After retaining them for their services
      and after a few short months of preparing our business to start winning
      government contracts, our first contract was won. DKA’s “lets get it done”
      attitude and endless hours of research and business development to help
      align our company in the tight government sector has been beyond what I
      could ever imagine. The knowledge, dedication and perseverance Terry and
      his crew over at DKA has shown us is beyond exceptional. Now, 9 years later
      with calculated planning and execution, we are going strong and have
      recently won several contracts (some of which are 5 year). In closing, I
      would like to thank Terry, Mike, Dustin and the DKA team as a whole for the
      endless hours of phone call consultations and other business operation
      support to help “school us” to ensure we perform our contracts with the
      performance the government expects and demands. DKA’s loyal and undying
      service to our company has been truly the key to our success. Thanks DKA.

  # SOURCE: .../2017/10/Thumb.png — meaningless filename; identified as Greene
  # Respiratory from surrounding copy. Confirm on download.
  - client: Greene Respiratory Services
    author: Steve Russell
    role: CFO
    logo: /images/clients/greene-respiratory.png
    quote: >-
      Greene Respiratory Services has been using DKA as our Federal Government
      bidding partner since 2001 and we have truly enjoyed an excellent
      partnership in the process. We feel that without DKA, our efforts to obtain
      new federal government contracts would have been diminished greatly. The
      results have been excellent.

  # SOURCE: .../2017/10/maxsent.png
  - client: Maxsent
    author: Todd Pattison
    role: President
    logo: /images/clients/maxsent.png
    quote: >-
      I have known, worked with, and won federal government contracts with DKA
      for 12 years. They have exceeded every expectation I have had when it has
      come to their expertise of the contract/agency, timeliness, and quality of
      the proposal. I would highly recommend them to anyone who desires to do
      business with any government agency.

  # SOURCE: .../2017/10/mcfarlane.png
  - client: McFarlane Sheet Metal
    author: Dave McFarlane
    logo: /images/clients/mcfarlane.png
    quote: >-
      The professionalism, integrity and technical competency of DKA is
      outstanding. They were able to obtain our certification in 3 months. They
      continued to help walk our proposal through the entire submittal process.
      They responded to continual change requests from the federal government and
      completely exceeded our expectations by helping us even after we were
      issued our GSA contract number. DKA did all this work, honored their
      original estimated price, met all time lines and most importantly delivered
      exactly what they had promised. I would highly recommend DKA to anyone
      needing help in obtaining GSA certification. Their pricing is fair, their
      service outstanding, and they deliver what they promise.


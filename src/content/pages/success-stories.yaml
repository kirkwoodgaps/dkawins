# PRESERVED VERBATIM from the live <title>.
title: "Government Contract Success Stories | Winning Government Contracts"
path: /success-stories/

# The visible <h1>. Without this the page renders its SEO <title> on screen,
# pipe and all.
heading: DKA Success Stories

# PRESERVED VERBATIM from the live <meta name="description">.
metaDescription: >-
  Hundreds of government contractors have utilized DKA's proposal writing
  services to win government contracts. Find Opportunities to Contract with the
  Federal Government.

# Nate's rewrite (2026-09-11), with two edits:
#
#  1. "specialized equipment" restored to "mobile asphalt plants". The live site
#     uses the specific, odd examples — they are more memorable than a category
#     label and they are demonstrably true.
#  2. "hundreds of government contracts" -> "more than 350", so the sentence
#     agrees with the stat tile directly beneath it.
#
# This rewrite also fixes a long-standing problem: the published intro ended
# "The following is a partial list of agencies and locations of these
# contracts", and no such list has ever appeared on the page
# (MIGRATION-NOTES.md § 4.2). Dropping that sentence closes the gap.
intro: >-
  DKA has helped clients win more than 350 government contracts across an
  extremely wide variety of products and services, from logistics management to
  IT, professional staffing to medical services, and environmental services to
  mobile asphalt plants. We've also helped clients obtain HUBZone and 8(a)
  certifications and contract vehicles such as CMAS, TXMAS, and the GSA
  Schedule.

# All four confirmed by Nate. The GSA Schedule tile is new to this page and is
# DKA's strongest GSA-specific credential.
stats:
  - value: "1995"
    label: Winning federal contracts for clients since
  - value: "350+"
    label: Contract awards won for clients
  - value: "$1.7B+"
    label: Combined value of client contract awards
  - value: "500+"
    label: GSA Schedules secured for client companies

# Sits above the testimonials. Nate's copy, second sentence rewritten.
#
# The draft's second sentence read: "Many describe our team as an extension of
# their own business development staff." No client says that — the phrase
# appears in none of the six testimonials on this page. Replaced with the claim
# the quotes DO support: Argent names 9 years, Maxsent 12, Greene has worked
# with DKA since 2001, and E&S since 1995.
testimonialsIntro: >-
  Clients consistently point to DKA's hands-on support, research-driven
  approach, and responsiveness as key factors in their success winning and
  managing government contracts. Several have worked with us for a decade or
  more, from a first solicitation through years of contract performance.

cta:
  heading: Ready to Become Our Next Success Story?
  body: >-
    Whether you're pursuing your first federal contract or looking to secure a
    spot on the GSA Schedule, DKA's team is ready to help. Contact us today for
    a free, no-obligation consultation.
  label: Contact Us Today
  href: /contact-us/


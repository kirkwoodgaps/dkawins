caseStudies:
  # SOURCED: live page, verbatim. On the live site the first sentence is marked up
  # as an <h2> and the rest as body copy, which is why it reads as a heading
  # running into lowercase prose — see MIGRATION-NOTES.md § 4.6. Rejoined into one
  # paragraph here; the `heading` field is an editorial addition for the rebuild,
  # not live copy, and every figure in it is drawn from the body below.
  - client: C&S Jones Group
    # SOURCE: .../2020/07/CSJG-logo.png (use the original, not the -129x100 crop)
    logo: /images/clients/cs-jones-group.png
    heading: Four HUBZone contracts across four states
    body: >-
      In 2015 DKA reached out to C&S Jones Group to discuss the possibility of
      working together in pursuit of 2 specific contracts which were set-aside
      for HUBZone-certified contractors. At the time DKA did not have a
      relationship with a HUBZone-certified company with the experience and
      capabilities to win the contracts or successfully perform them. After
      several discussions about the opportunities it was mutually agreed that C&S
      Jones had everything it took to win and perform profitably.


      And that we did. Together we won both contracts ($1.7M over 5 years in
      Nevada and $3M over 5 years in Montana).


      And then we did it again, winning 2 more contracts ($7.5M over 5 years in
      Hawaii and $1.5M over 5 years in Oklahoma). C&S Jones Group is still
      operating all 4 contracts and looking for the next opportunities to pursue
      together.

  # SOURCED: live page, verbatim. Same split-heading artifact, rejoined.
  - client: E&S Diversified Services
    # SOURCE: .../2020/07/esheader5.jpg (use the original, not the -701x100 crop)
    logo: /images/clients/es-diversified.jpg
    heading: DKA’s first client, still working together today
    body: >-
      E&S Diversified Services was DKA’s first ever client in 1995 and we’re
      still working together today. To date we’ve assisted E&S in winning 26
      federal government contracts in 9 states with a combined award amount in
      excess of $92M. Nearly all of these contracts were for 5 years, and they’ve
      allowed E&S to expand into new industries and new geographic regions.


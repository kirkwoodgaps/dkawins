title: Industries We Serve
path: /industries-we-serve/
# New page, no live tag to preserve. Written from attested copy only.
metaDescription: >-
  From custodial services to IT, ambulance trips to real estate appraisals, DKA
  has helped clients across an extremely wide range of industries win government
  contracts since 1995.

# SOURCED: assembled from /who-we-are/ ("formed in August of 1995 ... helping
# small businesses win government contracts in basic service and maintenance
# industries. Over the years DKA's expertise broadened to cover virtually all
# aspects of the federal procurement process") and the homepage industry list.
intro: >-
  DeSutter, Kerr & Associates was formed in 1995 with a mission of helping small
  businesses win government contracts in basic service and maintenance
  industries. Over the years DKA’s expertise broadened to cover virtually all
  aspects of the federal procurement process. Our clients provide an extremely
  wide variety of products and services, from custodial to IT, ambulance trips to
  real estate appraisals, environmental services to mobile asphalt plants.


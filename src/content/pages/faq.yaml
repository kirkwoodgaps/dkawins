title: Frequently Asked Questions
path: /faq/
metaDescription: >-
  Answers to common questions about DKA's government proposal writing and
  GSA Schedule consulting services.
intro: >-
  Answers to common questions about working with DKA on government proposal
  writing and GSA Schedule services.

groups:
  - heading: Working with DKA
    items:
      # Nate's copy. Consistent with /who-we-are/ and /what-we-do/.
      - q: What does DKA do?
        a: >-
          DKA helps businesses win and manage government contracts through
          expert proposal writing, and helps companies get listed on and
          maintain the GSA Multiple Award Schedule.

      # Nate's copy, one edit: the draft said "nearly three decades". DKA was
      # formed in August 1995, so it is past three decades, and the 30-year logo
      # says so. Re-anchored to the founding year, which is attested. Figures
      # confirmed by Nate 2026-09-11.
      - q: How much experience does DKA have in government contracting?
        a: >-
          Since 1995, DKA has helped clients navigate federal procurement,
          contributing to more than 350 contract awards worth over $1.7 billion
          combined.

      # SOURCED: homepage and /who-we-are/ industry lists.
      # NOTE: the "agencies" half of this question is still unanswered. The live
      # site never names a customer agency. Either supply the agency list or
      # narrow the question to industries. See the held-back block below.
      - q: What industries does DKA typically work with?
        a: >-
          DKA has helped its clients win hundreds of government contracts to
          provide an extremely wide variety of products and services, from
          custodial to IT, ambulance trips to real estate appraisals,
          environmental services to mobile asphalt plants, etc. We've also
          helped our clients obtain HUBZone & 8(a) certifications and contract
          vehicles, such as CMAS, TXMAS, and the GSA Schedule.

      # Nate's copy. Commits to no figure, which is the right call for a
      # published pricing statement.
      - q: How do your fees typically work?
        a: >-
          Fee structures vary by engagement and scope, and we discuss pricing
          transparently during your free initial consultation so you know
          exactly what to expect before any work begins.

      # Nate's copy. The free, no-obligation consultation is attested on the
      # GSA, CMAS, TXMAS and MAS pages.
      - q: How do I get started?
        a: >-
          Contact our team for a free, no-obligation consultation to discuss
          your company's goals and determine the best path forward.

      # TODO — NOT SOURCED. "Nationwide" appears nowhere on the live site. The
      # strongest attested claim is on /success-stories/: one client won "26
      # federal government contracts in 9 states", with Nevada, Montana, Hawaii
      # and Oklahoma named. That supports multi-state, not nationwide.
      # Nate: confirm the real geographic footprint.
      - q: Does DKA work with businesses across the country?
        a: ""

  - heading: Proposal writing
    items:
      # Nate's copy. Makes no timeline commitment, which is why it is safe to
      # publish as written.
      - q: How long does it take to win a government contract?
        a: >-
          Timelines vary widely depending on the solicitation and agency, but
          our team works to keep your proposal on schedule from the research
          phase through submission and award.

      # Nate's copy. Matches the Post-Award Support tier on
      # /government-proposal-writing-services/ closely.
      - q: Does DKA help with contract management after award?
        a: >-
          Yes. Our post-award support covers everything from contract
          modifications to ongoing technical and administrative assistance
          throughout the life of the contract.

  - heading: GSA Schedule
    items:
      # Nate's copy. A description of the federal program, not a DKA claim, and
      # independently verifiable.
      - q: What is the GSA Schedule?
        a: >-
          The GSA Multiple Award Schedule is a long-term government-wide
          contract that gives federal buyers a streamlined way to purchase
          products and services from approved vendors like your company.

      # Nate's copy. Program description rather than a DKA claim.
      - q: Why does my business need a GSA Multiple Award Schedule contract?
        a: >-
          The GSA Schedule is a long-term, government-wide contract vehicle that
          pre-qualifies your company to sell to federal agencies without
          competing on every solicitation, which can significantly shorten the
          federal sales cycle.

      # Nate's copy, one edit: "over 500 GSA Schedule contracts" became "more
      # than 500 GSA Schedules", matching the metric Nate confirmed on
      # 2026-09-11. The industries named are attested on /who-we-are/.
      - q: Which GSA Schedule categories or SINs can DKA help me pursue?
        a: >-
          We support clients across Special Item Numbers spanning IT services,
          professional services, facilities, industrial products, and more, and
          have helped clients secure more than 500 GSA Schedules to date.

      # Nate's copy, and the best-sourced answer here: /who-we-are/ already
      # names GSA Advantage listing, catalog modifications, quarterly sales
      # reporting and Industrial Funding Fee payments almost word for word.
      - q: What is involved in maintaining a GSA Schedule contract after award?
        a: >-
          Ongoing compliance includes annual sales reporting, Commercial Sales
          Practices updates, catalog maintenance, and timely contract
          modifications, all of which our team can manage on your behalf.

      # Nate's copy. Catalog modifications are attested on /who-we-are/; the
      # modification types named are standard GSA categories, not DKA claims.
      - q: Do you help with GSA Schedule modifications and price adjustments?
        a: >-
          Yes. We prepare and submit administrative, economic price adjustment,
          and additional SIN modifications to keep your contract current and
          competitive.


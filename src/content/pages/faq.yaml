groups:
  - heading: Working with DKA
    items:
      # SOURCED: /who-we-are/ ("The core of our services...") + /what-we-do/
      # ("DKA has extensive experience with the General Service Administration...").
      - q: What does DKA do?
        a: >-
          The core of our services remains in helping our clients respond to
          government solicitations; nothing is as rewarding as helping our
          clients grow their businesses through winning government contracts.
          DKA has extensive experience with the General Service Administration
          (GSA) Federal Supply Service (FSS) Multiple Award Schedule (MAS),
          better known as the GSA Schedule, and has written hundreds of winning
          government proposals for clients. From initial solicitation review to
          contract startup, DKA is with you for the entire process.

      # SOURCED: /who-we-are/ (founding date, broadened expertise) + / (350 wins,
      # $1.7 Billion). NOTE: the homepage meta description says "more than 300"
      # while its own body says "more than 350" — see MIGRATION-NOTES.md §3.4.
      # This answer uses the body figure, matching the agreed hero stat row.
      - q: How much experience does DKA have in government contracting?
        a: >-
          DeSutter, Kerr & Associates, Inc. was formed in August of 1995 with a
          mission of helping small businesses win government contracts in basic
          service and maintenance industries. Over the years DKA's expertise
          broadened to cover virtually all aspects of the federal procurement
          process. With more than 350 wins with a combined value in excess of
          $1.7 Billion, DKA has the experience to increase your likelihood of
          success on every project.

      # PARTIAL. Industries half is SOURCED from / and /who-we-are/.
      # The "agencies" half of the question is NOT answered: the live site never
      # names civilian or defense agencies. State-level work IS supported
      # (CMAS and TXMAS pages). Either supply the agency list or narrow the
      # question to industries only.
      - q: What industries and agencies does DKA typically work with?
        a: >-
          DKA has helped its clients win hundreds of government contracts to
          provide an extremely wide variety of products and services, from
          custodial to IT, ambulance trips to real estate appraisals,
          environmental services to mobile asphalt plants, etc. We've also
          helped our clients obtain HUBZone & 8(a) certifications and contract
          vehicles, such as CMAS, TXMAS, and the GSA Schedule.


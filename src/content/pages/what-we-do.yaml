services:
  heading: Our Services
  # SOURCED: live page § OUR PROCESS, verbatim.
  intro: >-
    Our goal for each of our clients is to grow and improve their business in the
    government sector. Since 1995, our clients have trusted us to identify,
    pursue, win and maintain contracts at the federal and state level. Every
    company is different, so our team of knowledgeable experts is on hand to
    tailor the right blend of our proposal writing and business development
    services for each one.
  # Same five as the homepage, one per indexed service page. The live page
  # described three of these and linked to none.
  items:
    - title: Government Proposal Writing
      body: >-
        We develop the full written response covering technical, management,
        quality control, past performance and cost requirements, using input
        specific to how your company does business.
      href: /government-proposal-writing-services/
    - title: GSA Schedule Services
      body: >-
        DKA has extensive experience with the GSA Multiple Award Schedule. We
        have helped secure more than 500 GSA Schedules and keep them compliant,
        current and competitive after award.
      href: /gsa-schedule-services/
    - title: GSA MAS Consolidation
      body: >-
        One master contract vehicle organised around Large Categories,
        Subcategories and SINs. We make sure your offerings are mapped to the
        ones that put you in front of the right buyers.
      href: /gsa-multiple-award-schedules-mas-consolidation/
    - title: California Multiple Award Schedules (CMAS)
      body: >-
        Extend an active federal Schedule into California, opening state
        agencies, cities, counties, school districts and special districts.
      href: /california-multiple-award-schedules-cmas/
    - title: Texas Multiple Award Schedule (TXMAS)
      body: >-
        Adapt a competitively awarded contract you already hold into a Texas
        vehicle, reaching state agencies, universities and Texas SmartBuy members.
      href: /texas-multiple-award-schedule-program/

sections:
  # SOURCED: live page, verbatim.
  - heading: Government Contracting Vehicles
    body: >-
      Many agencies choose to award contracts to a large pool of contractors in a
      particular industry or industry grouping. These contractors are then able
      to bid on individual contracts and task orders. Getting onto the right
      vehicle is often what determines which opportunities your company is even
      eligible to pursue.

  - heading: Getting to Know Your Business
    body: >-
      Nobody knows your business better than you. Understanding your government
      contracting goals is essential to develop a successful strategy, and
      understanding what makes your company uniquely qualified to provide
      government buyers with your products and services is critical for writing
      winning proposals.

  - heading: Identifying and Pursuing the Right Contracts
    body: >-
      Success in government contracting takes more than just finding bidding
      opportunities; it requires finding the right projects and pursuing them in
      the best way possible. DKA tailors its services to create the ideal fit for
      your company, concentrating on those contracting vehicles and opportunities
      which make sense and are likely to help you realise your public sector
      goals.

  - heading: Developing the Winning Proposal
    body: >-
      Whether it's submitting a GSA Schedule application or responding to an RFP,
      our focus is always on one thing: obtaining your contract award. With more
      than 350 wins with a combined value in excess of $1.7 billion, DKA has the
      experience to increase your likelihood of success on every project.


metaDescription: >-
  Since 1995, DKA has deciphered thousands of government solicitations and
  developed hundreds of winning proposal responses for clients across numerous
  industries.

intro: >-
  Since 1995, DKA has successfully deciphered thousands of government
  solicitations across numerous industries and developed hundreds of winning
  proposal responses. We understand what it takes to consistently prepare
  proposals that meet and surpass the requirements and expectations of government
  contracting offices, increasing your chances of winning each contract you
  pursue.

sections:
  - heading: Proposal Development Services
    body: >-
      We develop the written proposal response covering technical, management,
      quality control, past performance, cost, and any other requirements of the
      solicitation, using input specific to how your company does business. Every
      proposal is outlined, collaborated upon, reviewed from an evaluator's
      standpoint, revised, and submitted in its optimal form.

  - heading: Post-Submittal Support
    body: >-
      DKA offers full post-submittal phase support, including common contracting
      office requirements such as Clarification Requests and Deficiency Reports
      (CRs/DRs), Best and Final Offer (BAFO)/Final Proposal Revision (FPR), oral
      presentation preparation assistance, and pre-award survey preparation.

  - heading: Post-Award Support
    body: >-
      Our full-coverage post-award support includes assistance preparing plans
      and procedures required by the agency, such as quality control, staffing,
      management, personnel and subcontractor recruitment, vendor/supplier
      acquisition, and contract phase-in/transition plans, along with negotiation
      of contract modifications and ongoing technical and administrative support
      throughout the life of the contract.

  - heading: Research
    body: >-
      DKA routinely conducts thorough research on contracting opportunities to
      determine how and whether to proceed, including Freedom of Information Act
      (FOIA) research, solicitation analysis for specific requirements,
      researching available contracting resources at the federal, state, county,
      and local levels, and agency-specific monitoring.


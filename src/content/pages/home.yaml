stats:
  - value: "1995"
    label: Winning federal contracts for clients since
  - value: "350+"
    label: Contract awards won for clients
  - value: "$1.7B+"
    label: Combined value of client contract awards

services:
  # SOURCED: live homepage section heading "WHAT WE DO".
  heading: What We Do
  # SOURCED: live homepage, verbatim. The draft dropped the middle sentence
  # ("Since 1995, our clients have trusted us to identify, pursue, win and
  # maintain contracts at the federal and state level") — restored.
  intro: >-
    Our goal for each of our clients is to grow and improve their business in the
    government sector. Since 1995, our clients have trusted us to identify,
    pursue, win and maintain contracts at the federal and state level. Every
    company is different, so our team of knowledgeable experts is on hand to
    tailor the right blend of our proposal writing and business development
    services for each one.

  # RESTRUCTURED. CLAUDE.md § Homepage structure calls for "the four GSA offerings
  # plus proposal writing". The draft shipped four cards that collapsed CMAS and
  # TXMAS into one and omitted MAS Consolidation entirely, leaving two indexed
  # pages unlinked from the homepage. Five cards below, one per indexed service
  # page. Every body is quoted from that page.
  items:
    # SOURCED: /government-proposal-writing-services/, "Proposal Development
    # Services", verbatim.
    - title: Government Proposal Writing
      body: >-
        Development of the written proposal response encompassing technical,
        management, quality control, past performance, cost, and any other
        requirements of the solicitation, utilizing our client’s input which is
        specific to the way the client does business.
      href: /government-proposal-writing-services/

    # SOURCED: /what-we-do/, "GSA SCHEDULE SERVICES", verbatim.
    - title: GSA Schedule Services
      body: >-
        DKA has extensive experience with the General Service Administration
        (GSA) Federal Supply Service (FSS) Multiple Award Schedule (MAS), better
        known as the GSA Schedule. We’ve helped hundreds of companies list their
        products and services.
      href: /gsa-schedule-services/

    # SOURCED: /gsa-multiple-award-schedules-mas-consolidation/, verbatim.
    # NOTE: that page is dated — it describes the consolidation as upcoming on
    # October 1, 2019. Copy preserved, but the page needs a rewrite from Nate.
    - title: GSA MAS Consolidation
      body: >-
        The GSA Schedule experts at DKA can help guide you through these new
        developments, and make sure you’re properly positioned to receive
        contract awards under the new Consolidated Schedule.
      href: /gsa-multiple-award-schedules-mas-consolidation/

    # SOURCED: /california-multiple-award-schedules-cmas/, verbatim.
    # The draft's claim that CMAS and TXMAS are "two of the largest state markets
    # in the country" is not on the site and is not sourced. Dropped.
    - title: California Multiple Award Schedules (CMAS)
      body: >-
        The State of California establishes multiple award agreements–awards
        given to two or more contractors for the same products and/or services at
        the same or similar prices. The Schedule Contract experts at DKA can
        assist with obtaining and maintaining your CMAS Schedule contract.
      href: /california-multiple-award-schedules-cmas/

    # SOURCED: /texas-multiple-award-schedule-program/, verbatim.
    - title: Texas Multiple Award Schedule (TXMAS)
      body: >-
        The TXMAS Program adapts existing competitively awarded federal
        government or any other governmental entity contracts to service the
        procurement needs of state agencies and Texas SmartBuy members. The
        Schedule Contract experts at DKA can assist with obtaining and
        maintaining your TXMAS Schedule contract.
      href: /texas-multiple-award-schedule-program/


# PRESERVED VERBATIM from the live <meta name="description">.
# The draft rewrote this to say "more than 350 ... worth over $1.7 billion".
# The live tag says 300. See MIGRATION-NOTES.md § 3.4 — the site contradicts
# itself (300 in meta, 350 in body, "hundreds" elsewhere). Nate picks the number;
# until then the indexed text stands.
